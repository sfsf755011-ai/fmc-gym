<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>10/19 開會紀錄</title>
<style>
:root{
  --bg:#eceef2;--surface:#ffffff;--surface2:#f4f5f8;
  --border:#dde0e8;--border2:#c8cdd8;
  --text:#1a1c24;--text2:#5c6070;--text3:#9095a4;
  --accent:#1a1c24;
  --r:12px;--rs:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);font-size:15px}

/* ── HEADER ── */
.hd{background:#2a2d35;border-bottom:1px solid #1e2028;padding:22px 20px 20px;position:sticky;top:0;z-index:10}
.hd-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.hd-logo{width:48px;height:48px;border-radius:50%;flex-shrink:0}
.hd-text{}
.hd-badge{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.hd-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.01em;line-height:1.1}
.hd-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:3px}

/* ── CONTAINER ── */
.container{max-width:720px;margin:0 auto;padding:24px 20px 60px}

/* ── ITEM CARD ── */
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.item-card:last-child{margin-bottom:0}

.item-hd{padding:16px 18px 14px;display:flex;align-items:flex-start;gap:14px}
.item-num{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text2);flex-shrink:0;margin-top:1px}
.item-body{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.4;margin-bottom:6px}
.item-subs{display:flex;flex-direction:column;gap:4px}
.item-sub{font-size:13px;color:var(--text2);padding-left:14px;position:relative;line-height:1.5}
.item-sub::before{content:'·';position:absolute;left:4px;color:var(--text3)}

/* ── NOTES AREA ── */
.item-notes{border-top:1px solid var(--border);padding:12px 18px;background:var(--surface2)}
.notes-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.notes-ta{
  width:100%;min-height:72px;
  background:var(--surface);
  border:1.5px solid var(--border2);
  border-radius:var(--rs);
  padding:10px 12px;
  font-size:14px;color:var(--text);
  font-family:inherit;
  resize:vertical;outline:none;
  line-height:1.6;
  transition:border-color .15s,background .15s;
}
.notes-ta:focus{border-color:#2a2d35;background:#fff}
.notes-ta::placeholder{color:var(--text3)}

/* ── FOOTER ── */
.footer{text-align:center;padding:28px 0 8px;font-size:12px;color:var(--text3)}
</style>
</head>
